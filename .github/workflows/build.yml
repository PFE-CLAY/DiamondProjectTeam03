name: Release Build (GDrive + Discord)
on:
  push:
    tags:
      - 'build-*'

jobs:
  build-deploy:
    runs-on: [self-hosted, Windows]
    steps:
      # --- 0. SETUP & LOGGING ---
      - name: Setup Build Info
        shell: powershell
        run: |
          # Use Ticks to calculate accurate duration later
          $Ticks = (Get-Date).Ticks
          "BUILD_START_TICKS=$Ticks" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cleanup Workspace
        shell: powershell
        run: |
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract Commit Info
        shell: powershell
        run: |
          $CommitHash = git log -1 --format="%h"
          $CommitAuthor = git log -1 --format="%an"
          $CommitMsg = git log -1 --format="%s"
          
          "COMMIT_SHORT=$CommitHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COMMIT_AUTHOR=$CommitAuthor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COMMIT_MSG=$CommitMsg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --- 1. BUILD UNREAL ENGINE ---
      - name: Build and Package Game
        shell: cmd
        run: |
          set UAT_PATH="C:\Program Files\Epic Games\UE_5.6\Engine\Build\BatchFiles\RunUAT.bat"
          
          call %UAT_PATH% BuildCookRun ^
          -project="%GITHUB_WORKSPACE%\DiamondProject.uproject" ^
          -platform=Win64 ^
          -clientconfig=Shipping ^
          -build -cook -stage -package -archive ^
          -archivedirectory="%GITHUB_WORKSPACE%\PackagedBuild" ^
          -unattended -nologtimes -utf8output

      # --- 2. ZIP THE BUILD ---
      - name: Zip Build
        shell: powershell
        run: |
          $Version = "${{ github.ref_name }}"
          $ZipName = "BlackSands_Windows_$Version.zip"
          
          if (Test-Path $ZipName) { Remove-Item $ZipName }
          
          Compress-Archive -Path "PackagedBuild\Windows\*" -DestinationPath "$ZipName"
          
          "ZIP_FILENAME=$ZipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --- 3. UPLOAD & GET LINK ---
      - name: Upload to GDrive
        shell: powershell
        run: |
          $ZipName = "$env:ZIP_FILENAME"
          $RemotePath = "gdrive:Builds/$ZipName"
          
          rclone copy "$ZipName" "gdrive:Builds" -P
          
          $PublicLink = rclone link "$RemotePath"
          if (-not $PublicLink) { $PublicLink = "https://drive.google.com/drive/u/0/my-drive" }
          
          "DRIVE_LINK=$PublicLink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --- 4. NOTIFY DISCORD (RUNS ALWAYS + GIFS) ---
      - name: Send Discord Notification
        if: always()
        shell: powershell
        env:
          DISCORD_WEBHOOK: "https://discord.com/api/webhooks/1446531201266618430/tXOZLINh87qxV222COHS1BTo3MBI9Of2rGrzXBsNxNgee2pl_7a-KGOggJypgOe_5kdb"
          JOB_STATUS: ${{ job.status }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # --- GIF LISTS (MUST BE DIRECT .GIF LINKS) ---
          $SuccessGifs = @(
              "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExY21laTc3b3A0ZmFzM3hyaHR2NXgxdDRkNXppcHc4YTFkcGkwZnFseCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/muNcDSuINVr1e/giphy.gif",
              "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2tsNnY4a2d1anlkamsydGR2NG1meGFjejRudHlmb3lvOHE4em9zMCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/M769cF8gLiHPq/giphy.gif",
              "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmxzczFhZ25sb2k0cTllaGp3eXl1aWI3dGprY29yd2pmbm4zbWdqdyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/TR996IaHtmDi1x98zW/giphy.gif",
              "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZGp2NTN2NDVycDd6NnhkOGJnOHUxdDh6aXJuZ2syNzJybDN2ZDZ3ZiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/B2idWDiSBxM6kUs7ZF/giphy.gif",
              "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMzF1dTdlYjRueXNjc2ZiNTA4Y2RzenRtN21uem9jaTQ1c2s5am5jaSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Diym3aZO1dHzO/giphy.gif",
              "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3Z2g2czZ1anczMGJxMHF5ZHh6dGQzbzhqa3U0dmFlcG8zb2E1ZXpiYSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/36l9iDjXld2mHjlhwH/giphy.gif",
              "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3aGhiMDB0cHVlazdlZG5qZjNiazNwcWJzb2VoNnUyY2I4Z2Y1MmVpNCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/macxUG5uAzorongmSW/giphy.gif"
          )

          $FailGifs = @(
              "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExdzRlazBzY2Vmd2tmNW52bzA4bXJrYTF3Z2lwbHlzaXVnZTAxZ25icCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eRtdjiQ07r2rm2vik2/giphy.gif",
              "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWZtOGhjODAxNDJ5bGlwZmIwZGR6cjJ0Y3hzc2hqY2xnbHAyZ2Q5YyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/YqE3jbSQQR6x9g19Kj/giphy.gif",
              "https://media.giphy.com/media/d2lcHJPG5BTmmTEk/giphy.gif",
              "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZXN3M2FveTBxZnRuenhwZGhyZHNiODJuaGg0dWkyYnpzczJ4aGF6diZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Ogq1QkqP2RWRoX6G7P/giphy.gif",
              "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYzA0N3VsYXA5cTU2aHp4ZnY0cGgzOHJzdmFqYnZnbW9xeGRiOXYybSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/m6pEztxHF1vT4YcFhE/giphy.gif"
          )

          # --- STATUS LOGIC ---
          if ($env:JOB_STATUS -eq 'success') {
              $GifUrl = $SuccessGifs | Get-Random
              $Title = "Build Complete - ${{ github.ref_name }}"
              $Desc = "Build uploaded successfully."
              $Color = 5814783 # Green/Blue
          } else {
              $GifUrl = $FailGifs | Get-Random
              $Title = "Build Failed - ${{ github.ref_name }}"
              $Desc = "The build process failed. Check the logs."
              $Color = 15548997 # Red
          }

          # --- PREPARE INFO ---
          $Link = "$env:DRIVE_LINK".Trim()
          if ([string]::IsNullOrWhiteSpace($Link)) { $Link = "https://drive.google.com" }

          if ($env:BUILD_START_TICKS) {
              $StartTicks = [long]$env:BUILD_START_TICKS
              $EndTicks = (Get-Date).Ticks
              $Duration = [TimeSpan]::new($EndTicks - $StartTicks)
              $DurationStr = "{0:hh}h {0:mm}m {0:ss}s" -f $Duration
          } else {
              $DurationStr = "Unknown"
          }

          $CommitShort = "$env:COMMIT_SHORT"
          $CommitAuthor = "$env:COMMIT_AUTHOR"
          $RawMsg = "$env:COMMIT_MSG"
          # Sanitize
          $SafeMsg = $RawMsg -replace '\\', '\\\\' -replace '"', '\"'
          $CodeBlock = '```' + $SafeMsg + '```'

          # --- CONSTRUCT JSON ---
          $JsonPayload = @"
          {
            "content": "**Status Update: $env:JOB_STATUS**",
            "embeds": [
              {
                "title": "$Title",
                "description": "$Desc",
                "color": $Color,
                "fields": [
                  { "name": "Duration", "value": "$DurationStr", "inline": true },
                  { "name": "Status", "value": "$env:JOB_STATUS", "inline": true },
                  { "name": "Commit Info", "value": "**$CommitShort** by $CommitAuthor", "inline": false },
                  { "name": "Message", "value": "$CodeBlock", "inline": false },
                  { "name": "Download", "value": "[Direct Google Drive Link]($Link)", "inline": false }
                ],
                "image": {
                  "url": "$GifUrl"
                },
                "footer": { "text": "Built on Worker-PC via GitHub Actions" }
              }
            ]
          }
          "@

          Write-Host "Sending JSON Payload..."
          $headers = @{ "Content-Type" = "application/json" }

          function Post-Discord {
            param([string]$url, [string]$body, [hashtable]$headers)
            try {
              $resp = Invoke-RestMethod -Uri $url -Method Post -Headers $headers -Body $body
              return $true
            } catch {
              Write-Host "Invoke-RestMethod failed: $($_.Exception.Message)"
              return $false
            }
          }

          $maxRetries = 3
          $delaySec = 5
          for ($i = 0; $i -le $maxRetries; $i++) {
            if (Post-Discord -url $env:DISCORD_WEBHOOK -body $JsonPayload -headers $headers) { exit 0 }
            Start-Sleep -Seconds $delaySec
          }
          exit 1