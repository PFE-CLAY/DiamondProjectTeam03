name: Release Build (GDrive + Discord)
on:
  push:
    tags:
      - 'build-*' # Remember: use lowercase 'build-' in your git tag!

jobs:
  build-deploy:
    runs-on: [self-hosted, Windows]
    steps:
      # --- 0. SETUP & LOGGING ---
      - name: Setup Build Info
        shell: powershell
        run: |
          $StartTime = Get-Date
          Write-Host "Build Process Started at: $StartTime"
          # Save Start time to Env to calculate duration later
          "BUILD_START_TIME=$($StartTime.ToString('u'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cleanup Workspace
        shell: powershell
        run: |
          Write-Host "Cleaning up previous build files..."
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
          Write-Host "Workspace clean."

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract Commit Info
        shell: powershell
        run: |
          # Extract Git info for the notification
          $CommitHash = git log -1 --format="%h"
          $CommitAuthor = git log -1 --format="%an"
          $CommitMsg = git log -1 --format="%s"
          
          Write-Host "Current Commit: $CommitHash by $CommitAuthor"
          
          "COMMIT_SHORT=$CommitHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COMMIT_AUTHOR=$CommitAuthor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COMMIT_MSG=$CommitMsg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --- 1. BUILD UNREAL ENGINE ---
      - name: Build and Package Game
        shell: cmd
        run: |
          @echo off
          echo [INFO] Starting Unreal Engine Automation Tool...
          echo [INFO] Project: %GITHUB_WORKSPACE%\DiamondProject.uproject
          
          :: UPDATE THIS PATH TO YOUR UE VERSION IF NEEDED
          set UAT_PATH="C:\Program Files\Epic Games\UE_5.6\Engine\Build\BatchFiles\RunUAT.bat"
          
          :: Added -verbose to UAT for more details if something breaks
          call %UAT_PATH% BuildCookRun ^
          -project="%GITHUB_WORKSPACE%\DiamondProject.uproject" ^
          -platform=Win64 ^
          -clientconfig=Development ^
          -build -cook -stage -package -archive ^
          -archivedirectory="%GITHUB_WORKSPACE%\PackagedBuild" ^
          -unattended -nologtimes -utf8output
          
          echo [INFO] Build process finished.

      # --- 2. ZIP THE BUILD ---
      - name: Zip Build
        shell: powershell
        run: |
          $Version = "${{ github.ref_name }}"
          $ZipName = "BlackSands_Windows_$Version.zip"
          
          if (Test-Path $ZipName) { 
            Write-Host "Removing old zip file..."
            Remove-Item $ZipName 
          }
          
          Write-Host "Compressing build to $ZipName..."
          Compress-Archive -Path "PackagedBuild\Windows\*" -DestinationPath "$ZipName"
          Write-Host "Compression complete."
          
          "ZIP_FILENAME=$ZipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --- 3. UPLOAD & GET LINK ---
      - name: Upload to GDrive
        shell: powershell
        run: |
          $ZipName = "$env:ZIP_FILENAME"
          $RemotePath = "gdrive:Builds/$ZipName"
          
          Write-Host "Starting upload of $ZipName to Google Drive..."
          
          # Rclone copy with Progress flag (-P)
          rclone copy "$ZipName" "gdrive:Builds" -P
          
          Write-Host "Upload complete. Requesting public link..."
          $PublicLink = rclone link "$RemotePath"
          
          # Fallback link logic
          if (-not $PublicLink) { 
             Write-Warning "Could not generate direct link. Using fallback."
             $PublicLink = "https://drive.google.com/drive/u/0/my-drive" 
          }
          
          Write-Host "Download Link Generated: $PublicLink"
          
          "DRIVE_LINK=$PublicLink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --- 5. NOTIFY DISCORD ---
      - name: Send Discord Notification
        shell: powershell
        env:
          DISCORD_WEBHOOK: "https://discord.com/api/webhooks/1446531201266618430/tXOZLINh87qxV222COHS1BTo3MBI9Of2rGrzXBsNxNgee2pl_7a-KGOggJypgOe_5kdb"
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # --- Prepare Variables ---
          $Version = "${{ github.ref_name }}".Trim()
          $Link = "$env:DRIVE_LINK".Trim()
          if ([string]::IsNullOrWhiteSpace($Link)) { $Link = "https://drive.google.com" }

          # Calculate Duration
          $Start = Get-Date "$env:BUILD_START_TIME"
          $End = Get-Date
          $Duration = New-TimeSpan -Start $Start -End $End
          $DurationStr = "{0:hh}h {0:mm}m {0:ss}s" -f $Duration

          # Commit Info
          $CommitShort = "$env:COMMIT_SHORT"
          $CommitAuthor = "$env:COMMIT_AUTHOR"
          $CommitMsg = "$env:COMMIT_MSG"

          # --- Construct JSON Payload (No Emojis, Better Layout) ---
          $JsonPayload = @"
          {
            "content": "**Build Generation Complete**",
            "embeds": [
              {
                "title": "Black Sands - $Version",
                "description": "The automated build process has finished successfully.",
                "color": 5814783,
                "fields": [
                  { "name": "Duration", "value": "$DurationStr", "inline": true },
                  { "name": "Build Tag", "value": "$Version", "inline": true },
                  { "name": "Commit Info", "value": "**$CommitShort** by $CommitAuthor", "inline": false },
                  { "name": "Message", "value": "```$CommitMsg```", "inline": false },
                  { "name": "Download", "value": "[Direct Google Drive Link]($Link)", "inline": false }
                ],
                "footer": { "text": "Built on Worker-PC via GitHub Actions" }
              }
            ]
          }
          "@

          Write-Host "Sending JSON Payload..."
          # Write-Host $JsonPayload # Uncomment to debug JSON structure

          $headers = @{ "Content-Type" = "application/json" }

          # --- Retry Logic (Untouched as requested) ---
          function Post-Discord {
            param([string]$url, [string]$body, [hashtable]$headers)

            try {
              $resp = Invoke-RestMethod -Uri $url -Method Post -Headers $headers -Body $body
              Write-Host "Discord webhook POST succeeded."
              return $true
            } catch {
              Write-Host "Invoke-RestMethod failed: $($_.Exception.Message)"
              if ($_.Exception.Response) {
                $r = $_.Exception.Response
                $statusCode = $r.StatusCode.value__
                Write-Host "HTTP Status: $statusCode ($($r.StatusCode))"
                try {
                  $sr = New-Object System.IO.StreamReader($r.GetResponseStream())
                  $text = $sr.ReadToEnd()
                  Write-Host "Response body: $text"
                } catch {
                  Write-Host "Response body: <unavailable>"
                }
                # Retry on 429 or 5xx
                if ($statusCode -eq 429 -or ($statusCode -ge 500 -and $statusCode -lt 600)) {
                  return $false
                }
              } else {
                Write-Host "No HTTP response available; likely network/TLS/firewall issue."
              }
              throw
            }
          }

          $maxRetries = 3
          $delaySec = 5
          for ($i = 0; $i -le $maxRetries; $i++) {
            $ok = Post-Discord -url $env:DISCORD_WEBHOOK -body $JsonPayload -headers $headers
            if ($ok) { exit 0 }
            if ($i -lt $maxRetries) {
              Write-Host "Retrying in $delaySec seconds... (attempt $($i+2) of $($maxRetries+1))"
              Start-Sleep -Seconds $delaySec
              $delaySec = [Math]::Min($delaySec * 2, 60)
            }
          }

          Write-Error "Discord webhook POST failed after $($maxRetries+1) attempts."
          exit 1