name: Release Build (GDrive + Discord)
on:
  push:
    tags:
      - 'build-*' # Remember: use lowercase 'build-' in your git tag!

jobs:
  build-deploy:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Cleanup Workspace
        shell: powershell
        run: |
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      # --- 1. BUILD UNREAL ENGINE ---
      - name: Build and Package Game
        shell: cmd
        run: |
          :: UPDATE THIS PATH TO YOUR UE VERSION IF NEEDED
          set UAT_PATH="C:\Program Files\Epic Games\UE_5.6\Engine\Build\BatchFiles\RunUAT.bat"
          
          call %UAT_PATH% BuildCookRun ^
          -project="%GITHUB_WORKSPACE%\DiamondProject.uproject" ^
          -platform=Win64 ^
          -clientconfig=Development ^
          -build -cook -stage -package -archive ^
          -archivedirectory="%GITHUB_WORKSPACE%\PackagedBuild" ^
          -unattended -nologtimes -utf8output

      # --- 2. ZIP THE BUILD ---
      - name: Zip Build
        shell: powershell
        run: |
          $Version = "${{ github.ref_name }}"
          $ZipName = "BlackSands_Windows_$Version.zip"
          
          if (Test-Path $ZipName) { Remove-Item $ZipName }
          
          echo "Zipping to $ZipName..."
          Compress-Archive -Path "PackagedBuild\Windows\*" -DestinationPath "$ZipName"
          
          "ZIP_FILENAME=$ZipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --- 3. UPLOAD & GET LINK ---
      - name: Upload to GDrive
        shell: powershell
        run: |
          $ZipName = "$env:ZIP_FILENAME"
          $RemotePath = "gdrive:Builds/$ZipName"
          
          echo "Uploading $ZipName to Google Drive..."
          rclone copy "$ZipName" "gdrive:Builds" -P
          
          echo "Generating Public Link..."
          $PublicLink = rclone link "$RemotePath"
          
          # Replace this with your actual Google Drive Folder link as fallback
          if (-not $PublicLink) { $PublicLink = "https://drive.google.com/drive/u/0/my-drive" }
          
          echo "Link Generated: $PublicLink"
          
          "DRIVE_LINK=$PublicLink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --- 5. NOTIFY DISCORD ---
      - name: Send Discord Notification
        shell: powershell
        env:
          DISCORD_WEBHOOK: "https://discord.com/api/webhooks/1446491178353692682/Ctr1gTzbU4TmEAiP38rUpkWik4JSHuiRdCKq8vmmAx7UTUhqxZI4yjWk-uYdfnUxVfqp"
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $Version = "${{ github.ref_name }}".Trim()
          $Link = "$env:DRIVE_LINK".Trim()
          if ([string]::IsNullOrWhiteSpace($Link)) { $Link = "https://drive.google.com" }

          $JsonPayload = @"
          {
            "content": "**New Build Ready!** 🚀",
            "embeds": [
              {
                "title": "Black Sands - $Version",
                "description": "Build uploaded successfully.",
                "color": 5814783,
                "fields": [
                  { "name": "Branch/Tag", "value": "$Version", "inline": true },
                  { "name": "Download", "value": "[Click to Download]($Link)", "inline": true }
                ],
                "footer": { "text": "Built on Worker-PC" }
              }
            ]
          }
          "@

          Write-Host "Sending JSON Payload:"
          Write-Host $JsonPayload

          $headers = @{ "Content-Type" = "application/json" }

          function Post-Discord {
            param([string]$url, [string]$body, [hashtable]$headers)

            try {
              $resp = Invoke-RestMethod -Uri $url -Method Post -Headers $headers -Body $body
              Write-Host "Discord webhook POST succeeded."
              return $true
            } catch {
              Write-Host "Invoke-RestMethod failed: $($_.Exception.Message)"
              if ($_.Exception.Response) {
                $r = $_.Exception.Response
                $statusCode = $r.StatusCode.value__
                Write-Host "HTTP Status: $statusCode ($($r.StatusCode))"
                try {
                  $sr = New-Object System.IO.StreamReader($r.GetResponseStream())
                  $text = $sr.ReadToEnd()
                  Write-Host "Response body: $text"
                } catch {
                  Write-Host "Response body: <unavailable>"
                }
                # Retry on 429 or 5xx
                if ($statusCode -eq 429 -or ($statusCode -ge 500 -and $statusCode -lt 600)) {
                  return $false
                }
              } else {
                Write-Host "No HTTP response available; likely network/TLS/firewall issue."
              }
              throw
            }
          }

          $maxRetries = 3
          $delaySec = 5
          for ($i = 0; $i -le $maxRetries; $i++) {
            $ok = Post-Discord -url $env:DISCORD_WEBHOOK -body $JsonPayload -headers $headers
            if ($ok) { exit 0 }
            if ($i -lt $maxRetries) {
              Write-Host "Retrying in $delaySec seconds... (attempt $($i+2) of $($maxRetries+1))"
              Start-Sleep -Seconds $delaySec
              $delaySec = [Math]::Min($delaySec * 2, 60)
            }
          }

          Write-Error "Discord webhook POST failed after $($maxRetries+1) attempts."
          exit 1